schema_version: "1.1"
name: app-carousel-plotline
expected_outcome: |
  A 5 to 10 slide carousel for Plotline: a cover of 6 words or fewer, a stake slide,
  one idea per slide with short bodies, a recap, one ask, numbered slides, alt text, the export feature
  named near the end, a caption with up to 5 hashtags, the slides tool run, files saved under the
  plotline folder. No invented stats or user quotes.
context:
  scaffold_script: place-files.sh
